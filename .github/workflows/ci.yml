# Faz 01 kalite kapıları: lint/test/build + secret taraması.
# Actions sürümleri SHA ile sabitlenir (sürüm politikası); yükseltme bilinçli PR ile yapılır.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # postgres:18-alpine, 2026-11-01 digest'i (deploy/docker-compose.yml ile aynı)
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: serverctl_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: server_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serverctl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/control-plane
    env:
      TEST_DATABASE_URL: postgres://serverctl_test:ci-test-only@localhost:5432/server_control_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/control-plane/go.mod
          cache-dependency-path: backend/control-plane/go.sum
      - name: gofmt kontrolü
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test -race (birim + PostgreSQL 18 entegrasyon)
        run: go test -race -count=1 -timeout 300s ./...

  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci (lockfile)
        run: npm ci
      - name: lint
        run: npm run lint
      - name: typecheck (strict TS)
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build

  e2e:
    name: E2E (Playwright, gerçek backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: serverctl_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: server_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serverctl_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CP_DATABASE_URL: postgres://serverctl_test:ci-test-only@localhost:5432/server_control_test?sslmode=disable
      E2E_ADMIN_PASSWORD: guclu-parola-12345
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/control-plane/go.mod
          cache-dependency-path: backend/control-plane/go.sum
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Backend derle ve migration uygula
        run: |
          cd backend/control-plane
          go build -o /tmp/control-plane ./cmd/control-plane
          go run ./cmd/migrate up
          go run ./cmd/migrate status
      - name: Bootstrap token üret ve ilk yöneticiyi oluştur
        run: |
          TOKEN=$(/tmp/control-plane bootstrap | grep -E '^  [A-Za-z0-9_-]{43}$' | head -1 | xargs)
          test -n "$TOKEN" || { echo "bootstrap token üretilemedi"; exit 1; }
          /tmp/control-plane > /tmp/control-plane.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -sf -X POST http://127.0.0.1:8080/api/v1/bootstrap/admin \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$TOKEN\",\"username\":\"admin\",\"password\":\"$E2E_ADMIN_PASSWORD\",\"display_name\":\"E2E Admin\"}"
      - name: Frontend bağımlılık ve build
        run: |
          cd web
          npm ci
          npm run build
      - name: E2E smoke (gerçek Control Plane, system Chrome)
        run: cd web && E2E_REAL=1 E2E_BROWSER_CHANNEL=chrome API_PROXY_TARGET=http://127.0.0.1:8080 npx playwright test
      - name: Ekran görüntüleri ve rapor (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            web/test-results/
            web/playwright-report/
            docs/reviews/screenshots/phase-02/
          if-no-files-found: ignore
      - name: Sunucu logları (hata durumunda)
        if: failure()
        run: tail -50 /tmp/control-plane.log || true

  proto:
    name: Protokol (buf lint + üretim)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/control-plane/go.mod
          cache-dependency-path: backend/control-plane/go.sum
      - name: Go bin PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: buf lint + üretim + kırılma kapısı
        run: make proto-check

  agent:
    name: Agent (Go, ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Faz 04 iki distro test matrisi: Ubuntu 24.04 runner + Debian 13 container.
    # osdetect/metrics fixture'ları her iki distro için ayrıca birim test edilir.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            container: ""
          - name: debian-13
            container: "debian:13"
    container: ${{ matrix.container != '' && matrix.container || null }}
    steps:
      - name: Git ve derleme araçları (container)
        if: matrix.container != ''
        # gcc + libc6-dev: -race cgo gerektirir (CI bulgusu CI-07).
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates gcc libc6-dev
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: go vet
        run: cd agent && go vet ./...
      - name: go build (server-agent + server-privd)
        # -buildvcs=false: konteyner içinde git dubious-ownership damgası
        # hatası CI'ı kilitlemesin (CI bulgusu CI-05).
        run: cd agent && go build -buildvcs=false ./...
      - name: go test -race
        run: cd agent && CGO_ENABLED=1 go test -race ./...
      - name: Windows çapraz derleme kontrolü
        # Faz 05: linux runner'da GOOS=windows derlemesi her push'ta
        # windows kod yolunun (winscm/winevent/pipe broker) derlendiğini
        # garanti eder; gerçek testler agent-windows job'ında koşar.
        run: cd agent && GOOS=windows GOARCH=amd64 go build -buildvcs=false ./...

  agent-rhel:
    name: "Agent (gerçek dağıtım — ${{ matrix.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Faz 06: Rocky Linux 9 + AlmaLinux 9 disposable systemd container'ları —
    # destek iddialarının GERÇEK ortam kanıtı (os-release/dnf/systemd/firewalld).
    # Konteynerler disposable'dır; hiçbir gerçek host'a dokunulmaz.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rockylinux-9
            image: rockylinux:9
          - name: almalinux-9
            image: almalinux:9
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Agent test ikililerini derle (runner, go test -c)
        # go build test paketi için ikili ÜRETEMEZ (arşiv üretir — CI-16);
        # go test -c zorunlu.
        run: |
          cd agent
          go test -c -buildvcs=false -o /tmp/osdetect.test ./internal/osdetect/
          go test -c -buildvcs=false -o /tmp/fwops.test ./internal/fwops/
          go test -c -buildvcs=false -o /tmp/pkgops.test ./internal/pkgops/
      - name: systemd türetilmiş imaj hazırla
        # rockylinux:9 temel imajında systemd paketi YOKTUR (CI-15); systemd
        # türetilmiş disposable imaja kurulur (almalinux'ta da tutarlıdır).
        run: |
          printf 'FROM %s\nRUN dnf install -y -q systemd procps-ng && dnf clean all\n' '${{ matrix.image }}' > /tmp/Dockerfile.rhel-test
          docker build -q -t rhel-agent-test:ci -f /tmp/Dockerfile.rhel-test /tmp
      - name: systemd container başlat
        # privileged + cgroup host mount: container içinde GERÇEK systemd
        # PID1 olarak çalışır (disposable); firewalld gerçek çağrıyla sınanır.
        run: |
          docker run --privileged --cgroupns=host -d --name rhel-test -v /sys/fs/cgroup:/sys/fs/cgroup:rw rhel-agent-test:ci /usr/lib/systemd/systemd --unit=multi-user.target
          for i in $(seq 1 45); do
            state="$(docker exec rhel-test systemctl is-system-running 2>/dev/null || true)"
            if [ "$state" = "running" ] || [ "$state" = "degraded" ]; then break; fi
            sleep 2
          done
          docker exec rhel-test systemctl is-system-running || true
      - name: Test ikililerini container'a kopyala ve distro tespitini doğrula
        run: |
          docker cp /tmp/osdetect.test rhel-test:/tmp/osdetect.test
          docker cp /tmp/fwops.test rhel-test:/tmp/fwops.test
          docker cp /tmp/pkgops.test rhel-test:/tmp/pkgops.test
          docker exec -e EXPECTED_OS_ID=${{ matrix.name == 'rockylinux-9' && 'rocky' || 'almalinux' }} rhel-test \
            sh -c "chmod +x /tmp/*.test && /tmp/osdetect.test -test.run TestRealHostSmoke -test.v"
      - name: dnf/paket envanteri + firewalld gerçek sondağı
        run: |
          docker exec rhel-test dnf install -y -q firewalld procps-ng >/dev/null
          docker exec rhel-test systemctl start firewalld
          docker exec rhel-test firewall-cmd --state
          # Faz 06 paket envanteri runner'ı: gerçek rpm çıktısını ayrıştırır.
          docker exec -e EXPECTED_OS_ID=${{ matrix.name == 'rockylinux-9' && 'rocky' || 'almalinux' }} rhel-test sh -c "/tmp/pkgops.test -test.run TestRealPkgList -test.v"
          # Faz 06 firewall runner'ı: gerçek firewalld üzerinde durum + liste + önizleme (hata kanıtı bozar).
          docker exec -e EXPECTED_OS_ID=${{ matrix.name == 'rockylinux-9' && 'rocky' || 'almalinux' }} rhel-test sh -c "/tmp/fwops.test -test.run TestRealFirewall -test.v"
          docker exec rhel-test firewall-cmd --zone=public --list-all || true
      - name: Temizlik
        if: always()
        run: docker rm -f rhel-test || true

  agent-docker:
    name: Agent (gerçek Docker — dind lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Faz 07: GERÇEK Docker Engine kanıtı — runner'ın kendi daemon'ı üzerinde
    # disposable busybox container'ı ile tam lifecycle (list/inspect/logs/
    # stop/start/restart). EXPECTED_DOCKER=1 gate'i CI-17 dersi gereği SESSİZ
    # ATLANMAZ: daemon erişilemezse test BAŞARISIZ olur. Daemon yalnız unix
    # soketinden erişilir (TCP yok — ADR-0011).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Dockerx test ikilisini derle
        run: |
          cd agent
          go test -c -buildvcs=false -o /tmp/dockerx.test ./internal/dockerx/
      - name: Daemon hazır mı (ping kanıtı)
        run: docker version --format '{{.Server.APIVersion}} {{.Server.Version}}'
      - name: Disposable container başlat (busybox sleep)
        run: |
          docker pull -q busybox:1.36
          docker run -d --name srvctl-ci-docker busybox:1.36 sh -c 'echo srvctl-canvas-life && sleep 600'
          docker ps --filter name=srvctl-ci-docker --format '{{.Names}} {{.Status}}'
      - name: Engine adapter gerçek lifecycle kanıtı
        run: |
          EXPECTED_DOCKER=1 DOCKER_TEST_CONTAINER=srvctl-ci-docker /tmp/dockerx.test -test.run 'TestRealDockerSmoke|TestRealDockerLifecycle' -test.v
      - name: Temizlik
        if: always()
        run: docker rm -f srvctl-ci-docker || true

  agent-web:
    name: Agent (gerçek nginx + php-fpm — web lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Faz 08: GERÇEK web hosting kanıtı — runner'da gerçek nginx + php-fpm
    # ile tam site lifecycle (create/update/disable/delete + rollback
    # doğrulaması; docroot korunur). EXPECTED_WEB=1 gate'i CI-17 dersi
    # gereği SESSİZ ATLANMAZ: ortam eksikse test BAŞARISIZ olur. useradd +
    # /etc yazımı root ister → sudo. Runner VM disposable'dır.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: nginx + php-fpm kur
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm
          sudo systemctl enable --now nginx php8.3-fpm
          nginx -v && php-fpm8.3 -v
      - name: Webops test ikilisini derle
        run: |
          cd agent
          go test -c -buildvcs=false -o /tmp/webops.test ./internal/webops/
      - name: Web adapter gerçek lifecycle kanıtı
        run: |
          sudo -E env EXPECTED_WEB=1 /tmp/webops.test -test.run 'TestRealWebHostLifecycle' -test.v
      - name: TLS ops test ikilisini derle
        run: |
          cd agent
          go test -c -buildvcs=false -o /tmp/tlsops.test ./internal/tlsops/
      - name: Faz 09 TLS sertifika gerçek lifecycle kanıtı
        run: |
          # Anahtar üretimi + self-signed sertifika kurulumu + gerçek
          # nginx -t kapısı + reload + eşleşmeyen anahtar reddi (canlı
          # sertifika korunur). EXPECTED_TLS=1: sessiz atlama yasak (CI-17).
          sudo -E env EXPECTED_TLS=1 /tmp/tlsops.test -test.run 'TestRealTLSLifecycle' -test.v
      - name: Temizlik
        if: always()
        run: |
          sudo rm -f /etc/nginx/conf.d/srvctl-* || true
          sudo rm -f /etc/php/8.3/fpm/pool.d/srvctl-* || true
          sudo userdel sc-web-citest 2>/dev/null || true
          sudo rm -rf /var/www/server-control/citest || true
          sudo rm -rf /etc/nginx/ssl/srvctl-citest || true

  agent-dbfs:
    name: "Agent (gerçek PostgreSQL + MariaDB — db/fs lifecycle)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Faz 10: GERÇEK veritabanı + dosya yöneticisi kanıtı — runner'da
    # gerçek PostgreSQL + MariaDB ile tam DB lifecycle (create → user +
    # grant → backup → restore → delete; pg_dump/mysqldump DB-native
    # tutarlılık) ve gerçek docroot üzerinde FS lifecycle (upload/download/
    # chmod/chown + gerçek symlink-escape reddi). EXPECTED_DB=1/EXPECTED_FS=1
    # gate'leri CI-17 dersi gereği SESSİZ ATLANMAZ: ortam eksikse test
    # BAŞARISIZ olur. Runner disposable'dır; yalnız citest- önekli adlar
    # kullanılır.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: PostgreSQL + MariaDB kur ve başlat
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql mariadb-server
          sudo systemctl enable --now postgresql mariadb
          psql --version && mariadb --version
      - name: DBops test ikilisini derle
        run: |
          cd agent
          go test -c -buildvcs=false -o /tmp/dbops.test ./internal/dbops/
      - name: DB adapter gerçek lifecycle kanıtı
        run: |
          sudo -E env EXPECTED_DB=1 /tmp/dbops.test -test.run 'TestRealDBLifecycle|TestRealDBBackupContent' -test.v
      - name: FSops test ikilisini derle
        run: |
          cd agent
          go test -c -buildvcs=false -o /tmp/fsops.test ./internal/fsops/
      - name: FS adapter gerçek lifecycle kanıtı
        run: |
          sudo -E env EXPECTED_FS=1 /tmp/fsops.test -test.run 'TestRealFSLifecycle' -test.v
      - name: Temizlik
        if: always()
        run: |
          sudo -u postgres psql -c "DROP DATABASE IF EXISTS citest_faz10" || true
          sudo -u postgres psql -c "DROP DATABASE IF EXISTS citest_faz10b" || true
          sudo mysql -e "DROP DATABASE IF EXISTS citest_faz10" || true
          sudo mysql -e "DROP USER IF EXISTS 'citest_ro'@'localhost'" || true
          sudo userdel sc-web-citest 2>/dev/null || true
          sudo rm -rf /var/www/server-control/citest || true

  agent-windows:
    name: Agent (Go, windows-2025)
    runs-on: windows-2025
    timeout-minutes: 12
    # Faz 05: gerçek Windows runner'da SCM (salt okuma), named pipe broker
    # (SID allowlist), wevtutil event log, Win32 metrics ve registry facts
    # testleri koşar. Kontrol (start/stop) işlemleri arayüz mock'larıyla
    # sınanır; runner'da gerçek servis kontrolü yapılmaz.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: go vet
        run: cd agent; go vet ./...
      - name: go build (server-agent + server-privd)
        run: cd agent; go build -buildvcs=false ./...
      - name: go test
        run: cd agent; go test ./...

  secret-scan:
    name: Secret taraması
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Yüksek sinyalli secret desenleri
        run: bash scripts/secret-scan.sh
