# buf: protokol deposu yapılandırması (Lint + kırılma kontrolü + üretim).
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Çift yönlü stream zarfları bilinçli olarak AgentEnvelope/ServerEnvelope
    # adlandırılır (ConnectRequest/Response değil); gerekçe ADR-0008'de.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
